<!DOCTYPE html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>ML Recipe - Register</title>

        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "primary": "#13ec13",
                            "background-light": "#f6f8f6",
                            "background-dark": "#102210",
                        },
                        fontFamily: {
                            "display": ["Space Grotesk", "sans-serif"]
                        },
                        borderRadius: {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                    },
                },
            }
        </script>

        <style>
            body {
                font-family: 'Space Grotesk', sans-serif;
            }
        </style>
    </head>

    <body class="bg-background-light dark:bg-background-dark h-screen overflow-hidden flex flex-col">

        <main class="flex-1 flex overflow-hidden">
            <!-- Left Image Section -->
            <div class="hidden lg:flex flex-1 relative items-center justify-center p-6 bg-[#e8f5e8] dark:bg-[#1a2e1a]">
                <div class="max-w-md space-y-4 z-10 text-center">
                    <div
                        class="w-full aspect-[3/4] rounded-xl shadow-xl overflow-hidden bg-cover bg-center"
                        data-alt="Person happily cooking fresh vegetables in a bright modern kitchen"
                        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAXGA5k-mMUxqVfKZWYCCnnYY7Ag8wCQQf2aFaTlb3NZqR9P_uXiAyiFN_H0BugRFQVFf9dLB2YlSWCEBT0wNngw1yLZlfBQuAI7bJSEXIEkgpuHZRaJG7iZu1BIa1m2Vtu3QVzu0RJ2EtcQffRrYGVRjSlqWdtFIvgsIWVr6SORJA0WbxQRZca1flnxhKB8ee7SFmQt_zbOXgfahAA2LYvREJCXbrEeVklGuomqi5pukH3dwJVga_OgD8NyFMJQicb0ml7V-IUgQ');">
                    </div>

                    <div>
                        <h1 class="text-3xl font-black text-[#111811] dark:text-white font-display mb-2">
                            Smart Cooking with AI
                        </h1>
                        <p class="text-[#618961] dark:text-primary/70 text-base">
                            Discover recipes using ingredients you already have.
                        </p>
                    </div>
                </div>

                <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#13ec13_1px,transparent_1px)] [background-size:20px_20px]"></div>
            </div>

            <!-- Right Form Section -->
            <div class="flex-1 flex flex-col justify-center items-center p-4 sm:p-6 bg-white dark:bg-background-dark">
                <div class="w-full max-w-[440px] space-y-4">
                    <div class="space-y-1">
                        <h2 class="text-[#111811] dark:text-white text-3xl font-black font-display">
                            Create your account
                        </h2>
                        <p class="text-[#618961] dark:text-primary/60 text-sm">
                            Join our community of smart home chefs.
                        </p>
                    </div>

                    <form class="space-y-3" method="POST" action="/api/auth/signup" id="signupForm">

                        <div class="flex flex-col gap-1">
                            <label class="text-[#111811] dark:text-white text-sm font-medium">
                                Username
                            </label>
                            <input
                                id="username"
                                class="form-input w-full rounded-lg border-[#dbe6db] dark:border-[#2a3d2a] dark:bg-[#1a2e1a] dark:text-white focus:ring-primary focus:border-primary h-12 placeholder:text-[#618961] px-4 text-sm"
                                placeholder="Enter username"
                                type="text"
                                name="username"
                                required
                            />
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[#111811] dark:text-white text-sm font-medium">
                                Email
                            </label>
                            <input id="email" class="form-input w-full rounded-lg border-[#dbe6db] dark:border-[#2a3d2a] dark:bg-[#1a2e1a] dark:text-white focus:ring-primary focus:border-primary h-12 placeholder:text-[#618961] px-4 text-sm" placeholder="example@gmail.com" type="email" name="email" pattern=".*@gmail\.com$" required/>
                            <p id="emailError" class="text-red-600 text-xs hidden">Email must end with @gmail.com</p>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[#111811] dark:text-white text-sm font-medium">
                                Password
                            </label>
                            <input
                            id="password"
                            class="form-input w-full rounded-lg border-[#dbe6db] dark:border-[#2a3d2a] dark:bg-[#1a2e1a] dark:text-white focus:ring-primary focus:border-primary h-12 placeholder:text-[#618961] px-4 text-sm"
                            placeholder="••••••••"
                            type="password"
                            name="password"
                            pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?]).*$"
                            required
                            />

                            <p id="passwordError" class="text-red-600 text-xs hidden">Password must contain 1 capital letter and 1 special character</p>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[#111811] dark:text-white text-sm font-medium">
                                Confirm Password
                            </label>
                            <input
                                id="confirmPassword"
                                class="form-input w-full rounded-lg border-[#dbe6db] dark:border-[#2a3d2a] dark:bg-[#1a2e1a] dark:text-white focus:ring-primary focus:border-primary h-12 placeholder:text-[#618961] px-4 text-sm"
                                placeholder="••••••••"
                                type="password"
                                name="confirmPassword"
                                required
                            />
                            <p id="confirmError" class="text-red-600 text-xs hidden">
                                Passwords do not match
                            </p>
                        </div>

                        <button class="w-full flex items-center justify-center rounded-lg h-12 bg-primary text-[#111811] text-base font-bold hover:opacity-90 transition-opacity" type="submit">
                            Sign Up
                        </button>
                    </form>

                    <p id="signupError" class="text-red-600 text-sm hidden mt-4"></p>

                    <p class="text-center text-[#111811] dark:text-white text-sm">
                        Already have an account?
                        <a class="text-primary font-bold hover:underline" href="./signIn.html">
                            Login
                        </a>
                    </p>
                </div>
            </div>
        </main>

        <script>
            const form = document.getElementById('signupForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const confirmError = document.getElementById('confirmError');

            function validateEmail() {
                const email = emailInput.value;
                const isValid = email.includes('@gmail.com');
                if (!isValid && email.length > 0) {
                    emailError.classList.remove('hidden');
                } else {
                    emailError.classList.add('hidden');
                }
                return isValid || !email.length;
            }

            function validatePassword() {
                const password = passwordInput.value;
                const hasCapital = /[A-Z]/.test(password);
                const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':\"\\|,.<>\/?]/.test(password);
                const isValid = hasCapital && hasSpecial;
                if (!isValid && password.length > 0) {
                    passwordError.classList.remove('hidden');
                } else {
                    passwordError.classList.add('hidden');
                }
                return isValid || !password.length;
            }

            function validateConfirmPassword() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                const isValid = password === confirmPassword;

                if (!isValid && confirmPassword.length > 0) {
                    confirmError.classList.remove('hidden');
                } else {
                    confirmError.classList.add('hidden');
                }

                return isValid || !confirmPassword.length;
            }

            emailInput.addEventListener('blur', validateEmail);
            passwordInput.addEventListener('blur', validatePassword);
            confirmPasswordInput.addEventListener('blur', validateConfirmPassword);

            form.addEventListener('submit', function(e) {
                const emailValid = validateEmail();
                const passwordValid = validatePassword();
                const confirmValid = validateConfirmPassword();

                if (!emailValid || !passwordValid || !confirmValid) {
                    e.preventDefault();
                    if (!emailValid) emailError.classList.remove('hidden');
                    if (!passwordValid) passwordError.classList.remove('hidden');
                    if (!confirmValid) confirmError.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('currentUserEmail', emailInput.value.trim());
            });

            // Show server-side signup error if present in query params
            const params = new URLSearchParams(window.location.search);
            if (params.get('error') === 'exists') {
                const signupError = document.getElementById('signupError');
                if (signupError) {
                    signupError.innerHTML = 'Account already exists. Please <a href="./signIn.html" class="font-bold underline">sign in</a> instead.';
                    signupError.classList.remove('hidden');
                }
            }
            if (params.get('error') === 'password') {
                const signupError = document.getElementById('signupError');
                signupError.innerText = 'Passwords do not match.';
                signupError.classList.remove('hidden');
            }
        </script>
    </body>
</html>
